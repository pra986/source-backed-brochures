[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "source-backed-brochures"
version = "0.1.0"
description = "Evidence-first company brochures with bounded crawling and replayable source snapshots"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["brochure*"]

[tool.setuptools.package-data]
brochure = ["static/*.html"]
