[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "car-showroom-assistant"
version = "0.1.0"
description = "Inventory-grounded showroom assistant with confirmed synthetic booking requests"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
include = ["showroom*"]
[tool.setuptools.package-data]
showroom = ["static/*.html"]
