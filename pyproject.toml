[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "meeting-minutes-assistant"
version = "0.1.0"
description = "Evidence-linked, reviewable meeting minutes with optional audio transcription"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
include = ["minutes*"]
[tool.setuptools.package-data]
minutes = ["static/*.html"]
